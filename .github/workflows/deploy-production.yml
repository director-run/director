name: Production Deploy

on:
  push:
    branches: [production]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/__ci.yml
    with:
      build: false

  deploy-gateway:
    name: Gateway
    needs: ci
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/__cloudrun-deploy.yml
    with:
      environment: production
      service_name: director-production-gateway
      working-directory: packages/gateway
      migrations: true
      seed_enabled: true

  deploy-registry:
    name: Registry
    needs: ci
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/__cloudrun-deploy.yml
    with:
      environment: production
      service_name: director-production-registry
      working-directory: apps/registry
      migrations: true
      seed_enabled: true
