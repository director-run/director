name: Deploy

on:
  # workflow_run:
  #   workflows: ["CI"]
  #   types:
  #     - completed
  #   branches: [multi-tenancy]
  push:
    branches: [ "multi-tenancy" ]

jobs:
  deploy-gateway:
    name: Deploy packages/gateway to Cloud Run
    # if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/__cloudrun-deploy.yml
    with:
      environment: staging
      service_name: director-staging-gateway
      working-directory: packages/gateway
      migrations: true

  deploy-registry:
    name: Deploy apps/registry to Cloud Run
    # if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/__cloudrun-deploy.yml
    with:
      environment: staging
      service_name: director-staging-registry
      working-directory: apps/registry
      migrations: true